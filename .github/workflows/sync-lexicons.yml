name: Sync lexicons from upstream

'on':
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync and open PR
    runs-on: macos-26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: release-python
        with:
          python-version: '3.12'
          update-environment: false
      - name: Select and verify stable release toolchain
        shell: bash
        run: |
          set -euo pipefail
          export RELEASE_PYTHON312="${{ steps.release-python.outputs.python-path }}"
          test -x "$RELEASE_PYTHON312"
          export RELEASE_TOOLCHAIN_LANE=newest-stable
          export RELEASE_TOOLCHAIN_SELECTION=official-runner-inventory
          export RELEASE_EVIDENCE_CLASS=stable-release
          export RELEASE_DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          export RELEASE_XCODE_VERSION=26.6
          export RELEASE_XCODE_BUILD=17F113
          export RELEASE_IOS_RUNTIME=26.5
          export RELEASE_WATCHOS_RUNTIME=26.5
          export RELEASE_TVOS_RUNTIME=26.5
          export RELEASE_VISIONOS_RUNTIME=26.5
          source Scripts/activate-release-toolchain.sh
          {
            printf 'RELEASE_PYTHON312=%s\n' "$RELEASE_PYTHON312"
            printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR"
            printf 'RELEASE_SWIFT=%s\n' "$RELEASE_SWIFT"
            printf 'RELEASE_XCODEBUILD=%s\n' "$RELEASE_XCODEBUILD"
            printf 'RELEASE_XCRUN=%s\n' "$RELEASE_XCRUN"
            printf 'RELEASE_MINT=%s\n' "$RELEASE_MINT"
            printf 'MINT_PATH=%s\n' "$MINT_PATH"
            printf 'MINT_LINK_PATH=%s\n' "$MINT_LINK_PATH"
          } >> "$GITHUB_ENV"
          dirname "$RELEASE_SWIFT" >> "$GITHUB_PATH"
      - name: Bootstrap locked generator and release tools
        shell: bash
        run: |
          set -euo pipefail
          Scripts/bootstrap-generator-environment.sh
          Scripts/verify-generator-environment.sh
          PETREL_PYTHON="$GITHUB_WORKSPACE/.build/release-generator-venv/bin/python"
          test -x "$PETREL_PYTHON"
          printf 'PETREL_PYTHON=%s\n' "$PETREL_PYTHON" >> "$GITHUB_ENV"
          Scripts/bootstrap-release-tools.sh
      - name: Fetch upstream lexicons
        shell: bash
        run: |
          set -euo pipefail
          # com.atproto and tools.ozone are canonical in bluesky-social/atproto; app.bsky,
          # chat.bsky and network.bsky in bluesky-social/bsky. The tip of each main branch
          # is fetched, and the commits end up in generator/provenance/standard-lexicons.json
          # so the pull request this job opens names exactly what a reviewer is approving.
          fetch_lexicons() {
            local name=$1
            mkdir -p "/tmp/$name"
            git -C "/tmp/$name" init
            git -C "/tmp/$name" remote add origin "https://github.com/bluesky-social/$name.git"
            git -C "/tmp/$name" config core.sparseCheckout true
            git -C "/tmp/$name" sparse-checkout set lexicons
            git -C "/tmp/$name" fetch --depth 1 origin main
            git -C "/tmp/$name" checkout FETCH_HEAD
          }
          fetch_lexicons atproto
          fetch_lexicons bsky
          {
            printf 'ATPROTO_COMMIT=%s\n' "$(git -C /tmp/atproto rev-parse HEAD)"
            printf 'BSKY_COMMIT=%s\n' "$(git -C /tmp/bsky rev-parse HEAD)"
          } >> "$GITHUB_ENV"
      - name: Sync standard namespaces
        shell: bash
        run: |
          set -euo pipefail
          Scripts/sync-standard-lexicons.sh \
            /tmp/atproto/lexicons "$ATPROTO_COMMIT" \
            /tmp/bsky/lexicons "$BSKY_COMMIT"
      - name: Regenerate the Swift and Kotlin projections
        shell: bash
        run: |
          set -euo pipefail
          "$PETREL_PYTHON" run.py \
            --manifest generator/manifests/petrel-core.json \
            --language both
          "$PETREL_PYTHON" run.py \
            --manifest generator/manifests/petrel-ozone.json \
            --language swift
          "$PETREL_PYTHON" run.py \
            --manifest Tests/LexiconFixture/lexgen.json \
            --language swift
          "$RELEASE_MINT" run --executable swiftformat nicklockwood/SwiftFormat@0.61.1 \
            Sources/Petrel/Generated Sources/PetrelOzone/Generated Tests/LexiconFixture/Generated
      - name: Open PR if changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ github.token }}
          branch: bot/sync-lexicons
          title: 'Sync lexicons from bluesky-social/atproto and bluesky-social/bsky'
          commit-message: 'Sync standard lexicons from upstream + regenerate'
          add-paths: |
            generator/lexicons/**
            generator/provenance/standard-lexicons.json
            Sources/Petrel/Generated/**
            Sources/PetrelOzone/Generated/**
            Tests/LexiconFixture/Generated/**
            kotlin/src/main/kotlin/blue/catbird/petrel/generated/**
          body: |
            Automated weekly sync of the standard lexicon namespaces from their canonical
            repositories, followed by regeneration of the closed Swift and Kotlin projections
            and SwiftFormat:

            - `com.atproto`, `tools.ozone` from [bluesky-social/atproto](https://github.com/bluesky-social/atproto)
            - `app.bsky`, `chat.bsky`, `network.bsky` from [bluesky-social/bsky](https://github.com/bluesky-social/bsky)

            The synced commits are recorded in `generator/provenance/standard-lexicons.json`.
            Review the lexicon and generated-code diff before merging.
