name: Live network smoke

# Runs the env-gated tests that talk to real atproto services: the relay firehose, the
# Bluesky labeler stream, Jetstream (legacy and v2 APIs, with and without compression) and
# identity resolution (system DNS, well-known, PLC directory). They depend on third-party
# uptime, so they run on a schedule and on demand, never as a pull-request gate.
'on':
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-network
  cancel-in-progress: false

jobs:
  macos:
    name: macOS live streams and identity
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FIREHOSE_SMOKE_URL: wss://bsky.network/xrpc/com.atproto.sync.subscribeRepos
      LABELS_SMOKE_URL: https://mod.bsky.app
      JETSTREAM_SMOKE_URL: https://jetstream2.us-east.bsky.network/subscribe
      JETSTREAM_SMOKE_V2_URL: https://jetstream2.us-east.bsky.network
      PETREL_LIVE_IDENTITY_TESTS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Run live tests
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          swift test --filter 'FirehoseLiveSmokeTests|JetstreamLiveSmokeTests|DIDResolutionLiveTests'

  linux:
    name: Linux live identity (Swift 6.1.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: swift:6.1.2-jammy@sha256:5910655d205a5a54b0b9efdf72c4066a8de1932513fdc81793e2544b5d5a0709
    env:
      PETREL_LIVE_IDENTITY_TESTS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          for attempt in 1 2 3 4 5 6; do
            if apt-get update && apt-get install -y libsecret-1-dev libglib2.0-dev pkg-config; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1
      - name: Run live identity tests on the c-ares DNS path
        # The jammy image's libcurl has no WebSocket support, so the stream smoke tests
        # cannot run here; identity resolution exercises the Linux DNS and HTTP transports.
        shell: bash
        run: |
          set -euo pipefail
          swift test --disable-xctest --enable-swift-testing --filter DIDResolutionLiveTests
