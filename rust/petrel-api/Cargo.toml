[package]
name = "petrel-api"
description = "GENERATED AT Protocol API types for Petrel (from generator/manifests/petrel-core.json). Do not hand-edit src/generated."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Lane B: the generator writes one feature per top-level lexicon namespace
# here, with implication edges computed from cross-namespace refs.
default = []
wasm = ["petrel-core/wasm"]

[dependencies]
petrel-core = { workspace = true }
serde = { workspace = true }

# Generated code does not inherit the workspace lint table (a member's [lints]
# is all-or-nothing), so this crate carries its own.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
large_enum_variant = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
module_inception = "allow"
upper_case_acronyms = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
