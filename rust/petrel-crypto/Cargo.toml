[package]
name = "petrel-crypto"
description = "AT Protocol cryptography, did:key/multikey codecs, BLAKE3 SpaceSetHash, HPKE SpaceMAC, StrictJSON, and Service Auth JWTs for Petrel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = []
wasm = ["getrandom/js", "petrel-core/wasm"]

[dependencies]
petrel-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
blake3 = { workspace = true }
p256 = { workspace = true, features = ["ecdh"] }
k256 = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
web-time = { workspace = true }
async-lock = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
