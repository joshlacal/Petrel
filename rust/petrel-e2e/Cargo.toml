[package]
name = "petrel-e2e"
description = "End-to-end tests for the Petrel Rust runtime against the Swift test servers. Never published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Present only so `--features wasm` is valid across the workspace. The harness
# spawns processes and is native-only; it compiles to an empty crate on wasm32.
wasm = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = { workspace = true }
p256 = { workspace = true, features = ["pem"] }
petrel = { workspace = true, features = ["native"] }
petrel-core = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
url = { workspace = true }

[lints]
workspace = true
