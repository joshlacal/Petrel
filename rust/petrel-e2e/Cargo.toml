[package]
name = "petrel-e2e"
description = "End-to-end tests for the Petrel Rust runtime against the Swift test servers. Never published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Present only so `--features wasm` is valid across the workspace. The harness
# spawns processes and is native-only; it compiles to an empty crate on wasm32.
wasm = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
petrel = { workspace = true, features = ["native"] }
petrel-core = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
