[package]
name = "petrel-e2e"
description = "End-to-end tests for the Petrel Rust runtime against the Swift test servers. Never published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Present only so `--features wasm` is valid across the workspace. The harness
# spawns processes and is native-only; it compiles to an empty crate on wasm32.
wasm = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
p256 = { workspace = true, features = ["pem"] }
petrel = { workspace = true, features = ["native"] }
petrel-api = { workspace = true, features = ["com_atproto", "app_bsky"] }
petrel-core = { workspace = true }
petrel-server = { workspace = true, features = ["native", "axum"] }
reqwest = { workspace = true, features = ["form"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "signal", "process"] }
url = { workspace = true }


[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }

[lints]
workspace = true
