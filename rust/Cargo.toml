# Petrel Rust workspace.
#
# Shared file: created by Lane 0 of the Petrel Rust program and changed only by
# the integrator. Lanes add code under their own crate/module directories and
# never edit this manifest. Every dependency any lane is expected to need is
# pinned here; an unused entry costs nothing (it is not resolved until a member
# references it with `workspace = true`).
[workspace]
resolver = "3"
members = [
    "petrel-core",
    "petrel-crypto",
    "petrel-api",
    "petrel-ozone",
    "petrel-lexicon",
    "petrel-oauth-scopes",
    "petrel",
    "petrel-repo",
    "petrel-server",
    "petrel-plc",
    "petrel-spaces",
    "petrel-firehose",
    "petrel-jetstream",
    "petrel-e2e",
    "petrel-lexicon-fixture",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/joshlacal/Petrel"

[workspace.dependencies]
# Workspace members
petrel-core = { path = "petrel-core", version = "0.0.0" }
petrel-crypto = { path = "petrel-crypto", version = "0.0.0", default-features = false }
petrel-api = { path = "petrel-api", version = "0.0.0" }
petrel-oauth-scopes = { path = "petrel-oauth-scopes", version = "0.0.0" }
petrel = { path = "petrel", version = "0.0.0", default-features = false }
petrel-repo = { path = "petrel-repo", version = "0.0.0", default-features = false }
petrel-lexicon = { path = "petrel-lexicon", version = "0.0.0", default-features = false }
petrel-server = { path = "petrel-server", version = "0.0.0", default-features = false }
petrel-firehose = { path = "petrel-firehose", version = "0.0.0", default-features = false }

# Serialization & text
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
unicode-segmentation = { version = "1.13", default-features = false }

# Errors
thiserror = "2"

# Crypto (RustCrypto 0.13 line: matches every sibling lockfile; keep these
# types out of public APIs so the later 0.14 bump stays internal)
sha2 = { version = "0.10", default-features = false, features = ["std"] }
hmac = { version = "0.12", default-features = false }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "jwk"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
getrandom = "0.2"
aes-gcm = "0.10"
bs58 = "0.5"
zeroize = "1"
subtle = { version = "2.6", default-features = false }

# HTTP model, URLs, async plumbing (runtime-agnostic)
http = "1"
bytes = "1"
url = "2.5"
form_urlencoded = "1.2"
uuid = { version = "1", default-features = false }
async-lock = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
ruzstd = { version = "0.9", default-features = false, features = ["std", "hash"] }
web-time = "1.1"
tracing = { version = "0.1", default-features = false, features = ["std"] }

# Native-only (never in the wasm32 graph)
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", default-features = false }
tower-layer = "0.3"
tower-service = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
brotli = "8"
flate2 = "1"
rustix = { version = "1", features = ["fs", "process"] }
fs4 = { version = "1", default-features = false, features = ["sync"] }

# wasm32-unknown-unknown only
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
gloo-timers = { version = "0.4", features = ["futures"] }

# Optional interop (feature-gated in petrel-core by Lane A)
chrono = { version = "0.4", default-features = false, features = ["std"] }
time = { version = "0.3", default-features = false, features = ["std"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
cid = { version = "0.11", default-features = false, features = ["std"] }

# Test-only
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
wasm-bindgen-test = "0.3"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Protocol prose is full of names like CIDv1 and WebCrypto that are not code.
doc_markdown = "allow"
